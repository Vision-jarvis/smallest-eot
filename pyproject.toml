[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-eot-hi"
version = "0.1.0"
description = "Streaming Hindi/Hinglish end-of-turn and barge-in arbitration for Pulse-based voice agents (CPU only)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "scipy>=1.11", "pandas>=2.2", "pyarrow>=15", "soundfile>=0.12",
    "onnxruntime>=1.18", "huggingface_hub>=0.30", "scikit-learn>=1.5", "matplotlib>=3.8",
    "vosk>=0.3.45", "onnx>=1.16", "websockets>=12", "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "transformers>=4.40"]

[tool.setuptools]
packages = ["core", "eval", "adapters", "models", "arbiter", "bharat_turn", "sidecar", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
